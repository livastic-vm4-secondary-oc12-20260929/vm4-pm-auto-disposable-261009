merge_queue:
  max_parallel_checks: 2
  mode: serial

conflict_resolvers:
  - package-manager: npm
    directories:
      - /vm4-pm-auto-261008

queue_rules:
  - name: vm4-package-manager-auto-261008
    batch_size: 2
    batch_max_wait_time: 5 min
    queue_conditions:
      - title = VM4 PACKAGE MANAGER AUTO 261008
    merge_conditions:
      - check-success = vm4-never-package-manager-auto
    merge_method: merge-batch

  - name: vm4-devengines-impact-261009
    batch_size: 2
    batch_max_wait_time: 30 sec
    queue_conditions:
      - base = vm4-devengines-impact-base-261009
      - title = VM4 DEVENGINES IMPACT 261009
    merge_conditions:
      - check-success = vm4-devengines-impact-gate
    merge_method: merge-batch
